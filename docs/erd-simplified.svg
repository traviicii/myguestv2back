<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">MyGuest v2 Simplified ERD</title>
  <desc id="desc">Simplified entity relationship diagram for MyGuest using classic ERD cardinality markers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7f8fc"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="cardFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f9fbff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#24324a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #142033; }
      .subtitle { font: 500 17px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #51627c; }
      .card-title { font: 700 22px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #142033; }
      .card-subtitle { font: 600 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #5f6f89; letter-spacing: 0.08em; text-transform: uppercase; }
      .card-copy { font: 500 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #33435d; }
      .relation { font: 600 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #5a6781; }
      .legend-title { font: 700 16px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #17253a; }
      .legend-copy { font: 500 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #4f5f79; }
      .note-title { font: 700 18px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #17253a; }
      .note-copy { font: 500 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #495771; }
      .line { stroke: #63708a; stroke-width: 3; fill: none; stroke-linecap: round; }
      .marker { stroke: #63708a; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .marker-fill { stroke: #63708a; stroke-width: 3; fill: #ffffff; }
    </style>
  </defs>

  <rect x="0" y="0" width="1500" height="980" fill="url(#bg)"/>

  <text class="title" x="72" y="78">MyGuest v2 Simplified ERD</text>
  <text class="subtitle" x="72" y="108">Product-facing view of the live backend schema using classic ERD cardinality markers instead of flow arrows.</text>

  <g filter="url(#shadow)">
    <rect x="72" y="150" rx="22" ry="22" width="300" height="174" fill="url(#cardFill)" stroke="#d8e1f0"/>
    <text class="card-title" x="98" y="190">Account</text>
    <text class="card-subtitle" x="98" y="214">users</text>
    <text class="card-copy" x="98" y="246">PK: id</text>
    <text class="card-copy" x="98" y="272">Unique: firebase_uid, email</text>
    <text class="card-copy" x="98" y="298">Profile: first_name, last_name, photo_url</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="72" y="410" rx="22" ry="22" width="330" height="214" fill="url(#cardFill)" stroke="#d8e1f0"/>
    <text class="card-title" x="98" y="450">Client</text>
    <text class="card-subtitle" x="98" y="474">clients</text>
    <text class="card-copy" x="98" y="506">PK: id</text>
    <text class="card-copy" x="98" y="532">FK: owner_user_id</text>
    <text class="card-copy" x="98" y="558">Identity: first_name, last_name</text>
    <text class="card-copy" x="98" y="584">Contact: email, phone, birthday</text>
    <text class="card-copy" x="98" y="610">Context: client_type, notes</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="72" y="714" rx="22" ry="22" width="330" height="170" fill="url(#cardFill)" stroke="#d8e1f0"/>
    <text class="card-title" x="98" y="754">Color Profile</text>
    <text class="card-subtitle" x="98" y="778">color_charts</text>
    <text class="card-copy" x="98" y="810">PK: id</text>
    <text class="card-copy" x="98" y="836">FK + Unique: client_id</text>
    <text class="card-copy" x="98" y="862">Consultation details, levels, pigment, gray</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="530" y="400" rx="24" ry="24" width="392" height="234" fill="url(#cardFill)" stroke="#ced9ee" stroke-width="1.5"/>
    <text class="card-title" x="560" y="444">Appointment Log</text>
    <text class="card-subtitle" x="560" y="468">formulas</text>
    <text class="card-copy" x="560" y="502">PK: id</text>
    <text class="card-copy" x="560" y="530">FK: client_id</text>
    <text class="card-copy" x="560" y="558">When: service_at</text>
    <text class="card-copy" x="560" y="586">Money: price_cents</text>
    <text class="card-copy" x="560" y="614">Details: notes, legacy service_type</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1060" y="150" rx="22" ry="22" width="330" height="198" fill="url(#cardFill)" stroke="#d8e1f0"/>
    <text class="card-title" x="1086" y="190">Service Preset</text>
    <text class="card-subtitle" x="1086" y="214">services</text>
    <text class="card-copy" x="1086" y="246">PK: id</text>
    <text class="card-copy" x="1086" y="272">FK: owner_user_id</text>
    <text class="card-copy" x="1086" y="298">Catalog: name, normalized_name, sort_order</text>
    <text class="card-copy" x="1086" y="324">Defaults: price + return weeks</text>
    <text class="card-copy" x="1086" y="350">State: is_active</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1030" y="430" rx="22" ry="22" width="360" height="206" fill="url(#cardFill)" stroke="#d8e1f0"/>
    <text class="card-title" x="1056" y="470">Appointment Service Link</text>
    <text class="card-subtitle" x="1056" y="494">formula_services</text>
    <text class="card-copy" x="1056" y="526">PK: id</text>
    <text class="card-copy" x="1056" y="552">FKs: formula_id, service_id</text>
    <text class="card-copy" x="1056" y="578">Snapshot: service_label_snapshot</text>
    <text class="card-copy" x="1056" y="604">Ordering: position</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="875" y="736" rx="22" ry="22" width="330" height="148" fill="url(#cardFill)" stroke="#d8e1f0"/>
    <text class="card-title" x="901" y="776">Appointment Photo</text>
    <text class="card-subtitle" x="901" y="800">formula_images</text>
    <text class="card-copy" x="901" y="832">FK: formula_id</text>
    <text class="card-copy" x="901" y="858">Storage: provider, URL/object key, file_name</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1170" y="720" rx="18" ry="18" width="246" height="170" fill="#ffffff" stroke="#d8e1f0"/>
    <text class="legend-title" x="1192" y="754">Cardinality legend</text>
    <line class="line" x1="1196" y1="782" x2="1260" y2="782"/>
    <line class="marker" x1="1204" y1="772" x2="1204" y2="792"/>
    <line class="marker" x1="1216" y1="772" x2="1216" y2="792"/>
    <text class="legend-copy" x="1274" y="787">exactly one</text>
    <line class="line" x1="1196" y1="818" x2="1260" y2="818"/>
    <circle class="marker-fill" cx="1204" cy="818" r="7"/>
    <line class="marker" x1="1218" y1="808" x2="1218" y2="828"/>
    <text class="legend-copy" x="1274" y="823">zero or one</text>
    <line class="line" x1="1196" y1="854" x2="1260" y2="854"/>
    <circle class="marker-fill" cx="1204" cy="854" r="7"/>
    <path class="marker" d="M 1252 854 L 1264 844"/>
    <path class="marker" d="M 1252 854 L 1264 854"/>
    <path class="marker" d="M 1252 854 L 1264 864"/>
    <text class="legend-copy" x="1274" y="859">zero or many</text>
  </g>

  <g>
    <rect x="540" y="736" rx="18" ry="18" width="290" height="118" fill="#fef6e8" stroke="#f1d39d"/>
    <text class="note-title" x="566" y="774">Schema note</text>
    <text class="note-copy" x="566" y="804">Multi-service appointments use</text>
    <text class="note-copy" x="566" y="828">the normalized formula_services join.</text>
    <text class="note-copy" x="566" y="852">formulas.service_type still exists</text>
    <text class="note-copy" x="566" y="876">for legacy-friendly compatibility.</text>
  </g>

  <!-- users to clients -->
  <line class="line" x1="222" y1="324" x2="222" y2="410"/>
  <line class="marker" x1="212" y1="338" x2="232" y2="338"/>
  <line class="marker" x1="212" y1="350" x2="232" y2="350"/>
  <circle class="marker-fill" cx="222" cy="386" r="7"/>
  <path class="marker" d="M 222 398 L 210 410"/>
  <path class="marker" d="M 222 398 L 222 410"/>
  <path class="marker" d="M 222 398 L 234 410"/>

  <!-- users to services -->
  <line class="line" x1="372" y1="238" x2="1060" y2="238"/>
  <line class="marker" x1="390" y1="228" x2="390" y2="248"/>
  <line class="marker" x1="402" y1="228" x2="402" y2="248"/>
  <circle class="marker-fill" cx="1038" cy="238" r="7"/>
  <path class="marker" d="M 1050 238 L 1060 228"/>
  <path class="marker" d="M 1050 238 L 1060 238"/>
  <path class="marker" d="M 1050 238 L 1060 248"/>

  <!-- clients to color_charts -->
  <line class="line" x1="238" y1="624" x2="238" y2="714"/>
  <line class="marker" x1="228" y1="638" x2="248" y2="638"/>
  <line class="marker" x1="228" y1="650" x2="248" y2="650"/>
  <circle class="marker-fill" cx="238" cy="690" r="7"/>
  <line class="line" x1="238" y1="697" x2="238" y2="704"/>
  <line class="marker" x1="228" y1="714" x2="248" y2="714"/>

  <!-- clients to formulas -->
  <line class="line" x1="402" y1="518" x2="530" y2="518"/>
  <line class="marker" x1="416" y1="508" x2="416" y2="528"/>
  <line class="marker" x1="428" y1="508" x2="428" y2="528"/>
  <circle class="marker-fill" cx="506" cy="518" r="7"/>
  <path class="marker" d="M 518 518 L 530 508"/>
  <path class="marker" d="M 518 518 L 530 518"/>
  <path class="marker" d="M 518 518 L 530 528"/>

  <!-- formulas to formula_services -->
  <line class="line" x1="922" y1="518" x2="1030" y2="518"/>
  <line class="marker" x1="936" y1="508" x2="936" y2="528"/>
  <line class="marker" x1="948" y1="508" x2="948" y2="528"/>
  <circle class="marker-fill" cx="1006" cy="518" r="7"/>
  <path class="marker" d="M 1018 518 L 1030 508"/>
  <path class="marker" d="M 1018 518 L 1030 518"/>
  <path class="marker" d="M 1018 518 L 1030 528"/>

  <!-- formulas to formula_images -->
  <line class="line" x1="726" y1="634" x2="726" y2="690"/>
  <line class="line" x1="726" y1="690" x2="1040" y2="690"/>
  <line class="line" x1="1040" y1="690" x2="1040" y2="736"/>
  <line class="marker" x1="716" y1="648" x2="736" y2="648"/>
  <line class="marker" x1="716" y1="660" x2="736" y2="660"/>
  <circle class="marker-fill" cx="1040" cy="712" r="7"/>
  <path class="marker" d="M 1040 724 L 1028 736"/>
  <path class="marker" d="M 1040 724 L 1040 736"/>
  <path class="marker" d="M 1040 724 L 1052 736"/>

  <!-- services to formula_services -->
  <line class="line" x1="1225" y1="348" x2="1225" y2="430"/>
  <line class="marker" x1="1215" y1="362" x2="1235" y2="362"/>
  <line class="marker" x1="1215" y1="374" x2="1235" y2="374"/>
  <circle class="marker-fill" cx="1225" cy="406" r="7"/>
  <path class="marker" d="M 1225 418 L 1213 430"/>
  <path class="marker" d="M 1225 418 L 1225 430"/>
  <path class="marker" d="M 1225 418 L 1237 430"/>
</svg>
