    <text class="row" x="634" y="992">    public_url : text nullable</text>
    <text class="row" x="634" y="1014">    object_key : string nullable</text>
    <text class="row" x="634" y="1036">    file_name : string</text>
  </g>

  <g filter="url(#shadow)">
