<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1360" viewBox="0 0 1600 1360" role="img" aria-labelledby="title desc">
  <title id="title">MyGuest v2 Detailed ERD</title>
  <desc id="desc">Detailed entity relationship diagram for MyGuest with table-style boxes, key columns, and classic ERD cardinality markers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6f8fc"/>
      <stop offset="100%" stop-color="#edf2ff"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#20314a"/>
      <stop offset="100%" stop-color="#2e4668"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#24324a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #142033; }
      .subtitle { font: 500 17px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #51627c; }
      .table-name { font: 700 20px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #ffffff; }
      .table-label { font: 500 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #d8e4f7; letter-spacing: 0.08em; text-transform: uppercase; }
      .row { font: 500 14px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #2e3e58; }
      .legend-title { font: 700 16px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #17253a; }
      .legend-copy { font: 500 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #4f5f79; }
      .line { stroke: #66748f; stroke-width: 3; fill: none; stroke-linecap: round; }
      .marker { stroke: #66748f; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .marker-fill { stroke: #66748f; stroke-width: 3; fill: #ffffff; }
      .divider { stroke: #dbe4f3; stroke-width: 1; }
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="1360" fill="url(#bg)"/>

  <text class="title" x="64" y="70">MyGuest v2 Detailed ERD</text>
  <text class="subtitle" x="64" y="100">Technical table-level view of the live backend schema with crow&apos;s-foot style cardinality markers.</text>

  <g filter="url(#shadow)">
    <rect x="1260" y="46" rx="16" ry="16" width="280" height="156" fill="#ffffff" stroke="#d8e1f0"/>
    <text class="legend-title" x="1284" y="78">Cardinality legend</text>
    <line class="line" x1="1288" y1="104" x2="1352" y2="104"/>
    <line class="marker" x1="1296" y1="94" x2="1296" y2="114"/>
    <line class="marker" x1="1308" y1="94" x2="1308" y2="114"/>
    <text class="legend-copy" x="1366" y="109">exactly one</text>
    <line class="line" x1="1288" y1="138" x2="1352" y2="138"/>
    <circle class="marker-fill" cx="1296" cy="138" r="7"/>
    <line class="marker" x1="1310" y1="128" x2="1310" y2="148"/>
    <text class="legend-copy" x="1366" y="143">zero or one</text>
    <line class="line" x1="1288" y1="172" x2="1352" y2="172"/>
    <circle class="marker-fill" cx="1296" cy="172" r="7"/>
    <path class="marker" d="M 1344 172 L 1356 162"/>
    <path class="marker" d="M 1344 172 L 1358 172"/>
    <path class="marker" d="M 1344 172 L 1356 182"/>
    <text class="legend-copy" x="1366" y="177">zero or many</text>
  </g>

