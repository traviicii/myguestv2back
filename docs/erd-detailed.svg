    <rect x="620" y="130" rx="18" ry="18" width="360" height="58" fill="url(#header)"/>
    <text class="table-name" x="644" y="162">users</text>
    <text class="table-label" x="644" y="183">Account</text>
    <line class="divider" x1="620" y1="200" x2="980" y2="200"/>
    <text class="row" x="644" y="226">PK  id : integer</text>
    <text class="row" x="644" y="248">UK  firebase_uid : string nullable</text>
    <text class="row" x="644" y="270">UK  email : string</text>
    <text class="row" x="644" y="292">    first_name : string nullable</text>
    <text class="row" x="644" y="314">    last_name : string nullable</text>
    <text class="row" x="644" y="336">    photo_url : string nullable</text>
    <text class="row" x="644" y="358">    created_at / updated_at : datetime</text>
  </g>

