    <text class="row" x="94" y="528">FK  owner_user_id : integer</text>
    <text class="row" x="94" y="550">    first_name : string</text>
    <text class="row" x="94" y="572">    last_name : string</text>
    <text class="row" x="94" y="594">    email : string nullable</text>
    <text class="row" x="94" y="616">    phone : string nullable</text>
    <text class="row" x="94" y="638">    birthday : date nullable</text>
    <text class="row" x="94" y="660">    client_type : string nullable</text>
    <text class="row" x="94" y="682">    notes : text nullable</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="610" y="440" rx="18" ry="18" width="390" height="238" fill="#ffffff" stroke="#d9e2f0"/>
    <rect x="610" y="440" rx="18" ry="18" width="390" height="58" fill="url(#header)"/>
